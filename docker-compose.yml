  #         memory: 8G
  #   healthcheck:
  #     test:
  #       [
  #         'CMD-SHELL',
  #         '${OCR_PYTHON:-python3} -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:${OCR_PORT:-8000}/health'')"',
  #       ]
