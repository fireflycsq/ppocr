  label-api:
    build:
      context: ${OCR_SERVER_DIR:-./server}
      dockerfile: Dockerfile.label
    image: ${LABEL_API_IMAGE:-ppocr-label-api:1.0}
    container_name: ${LABEL_API_CONTAINER_NAME:-ppocr-label-api}
    restart: unless-stopped
    working_dir: /workspace
    volumes:
      - ${OCR_SERVER_DIR:-./server}:/workspace:ro
      - ${LABEL_DATA_DIR:-./data/label_data}:/data/label_data
    environment:
      LABEL_DATA_DIR: /data/label_data
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      LABEL_DEFAULT_USER: ${LABEL_DEFAULT_USER:-admin}
      LABEL_DEFAULT_PASSWORD: ${LABEL_DEFAULT_PASSWORD:-admin123}
      LABEL_ALLOW_REGISTER: ${LABEL_ALLOW_REGISTER:-true}
      LABEL_EXAMPLE_MAX_MB: ${LABEL_EXAMPLE_MAX_MB:-25}
      OLLAMA_BASE: http://${LLM_UPSTREAM:-host.docker.internal:11434}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8001/health'')"',
        ]
      interval: 15s
      timeout: 10s
      start_period: 45s
      retries: 5
    networks:
      - ppocr-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ppocr-web
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    environment:
      OCR_UPSTREAM: ${OCR_CONTAINER_NAME:-myppocr}:${OCR_PORT:-8000}
      LABEL_UPSTREAM: ${LABEL_API_CONTAINER_NAME:-ppocr-label-api}:8001
      # Ollama（Qwen3-VL）地址。默认走宿主机 11434 端口（要求宿主机 Ollama 监听 0.0.0.0）。
      # 若 Ollama 以容器方式部署，请在 .env 设置 LLM_UPSTREAM=<ollama容器名>:11434，
      # 并执行 docker network connect ppocr_ppocr-net <ollama容器名> 使其可达
      LLM_UPSTREAM: ${LLM_UPSTREAM:-host.docker.internal:11434}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      # ocr 容器暂时停用，恢复时加回：
      # ocr:
      #   condition: service_started
      label-api:
        condition: service_started
    networks:
      - ppocr-net

networks:
  ppocr-net:
    driver: bridge
